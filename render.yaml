services:
  - type: web
    name: ai-cfo-agent
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Dashboard response cache (app/core/cache.py). Set both in the Render
      # dashboard from console.upstash.com (region: us-west-2, near Oregon).
      # Left unset, the app still runs — caching is simply disabled.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "https://ai-cfo-agent-tau.vercel.app"
      - key: ALLOW_MODEL_FALLBACK
        value: "true"
