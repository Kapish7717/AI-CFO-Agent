name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install -q ruff
      - name: Lint application + evaluation code
        run: ruff check app tests scripts

  test:
    name: Unit + golden + trajectory evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite with coverage
        env:
          APP_ENV: development
          SEED_DEFAULT_USER: "0"
        run: |
          coverage run -m pytest tests -q
          coverage report -m \
            --include 'app/tools/anomaly_detection.py' --fail-under=80
          coverage report -m \
            --include 'tests/evals/agent_trajectory.py' --fail-under=80
          coverage report -m \
            --include 'app/core/security.py' --fail-under=80