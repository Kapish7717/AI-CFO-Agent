[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cfo-agent"
version = "0.1.0"
description = "Multi-agent CFO pipeline: LangGraph anomaly detection and reporting over a Supabase-backed transaction store."
requires-python = ">=3.11"
readme = "README.md"

# Mirrors requirements.txt, which stays the pinned input for the Docker build.
dependencies = [
    # Data & document processing
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "reportlab==4.4.7",
    "matplotlib==3.11.1",
    "pdfplumber>=0.11.0",
    # LangChain / LangGraph / MCP agent stack
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=1.0",
    "langgraph>=1.0,<2.0",
    "groq>=0.37",
    "mcp>=1.28",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "PyJWT>=2.9",
    "python-multipart>=0.0.12",
    # Database
    "psycopg2-binary==2.9.12",
    "supabase>=2.0.0",
    "stripe>=10.0",
    # Google integrations
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "gspread>=6.1.0",
    # Misc
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.4",
    "coverage[toml]>=7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP007", "B008"]

[tool.coverage.run]
branch = true
source = ["app", "tests"]

[tool.coverage.report]
show_missing = true
